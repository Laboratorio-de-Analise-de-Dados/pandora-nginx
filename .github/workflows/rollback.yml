name: ↩️ Rollback Pandora Gateway

# Restaura uma tag publicada anterior. Mesmo caminho do release.yml,
# com checkout no ref informado. Uso: workflow_dispatch + tag v*.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a restaurar (ex.: v0.1.0)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout da tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Copia os arquivos pro servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,Dockerfile,nginx/*,certbot/*"
          target: "/opt/pandora/nginx"

      - name: Sobe certbot + nginx
        uses: appleboy/ssh-action@v1.2.0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: CLOUDFLARE_API_TOKEN,CERTBOT_EMAIL
          script: |
            set -e
            cd /opt/pandora/nginx
            docker network inspect pandora_net >/dev/null 2>&1 || docker network create pandora_net
            docker compose up -d --build
            docker image prune -f

      - name: Smoke check — borda respondendo
        run: |
          sleep 10
          app=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://app.project-pandora.com.br/)
          api=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://api.project-pandora.com.br/)
          echo "app: $app | api: $api"
          [ "$app" != "000" ] && [ "$app" -lt 500 ] && [ "$api" != "000" ] && [ "$api" -lt 500 ]

      - name: Resumo
        run: echo "↩️ Gateway restaurado para ${{ inputs.tag }}"
