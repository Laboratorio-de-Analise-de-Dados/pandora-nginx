name: 🚀 Deploy Pandora Gateway (Nginx + Certbot)

# Deploy da camada de borda (proxy reverso + TLS automático).
# Em vez de clonar o repo no servidor, copiamos os arquivos via scp e subimos
# certbot + nginx com docker compose. O certbot emite/renova os certificados
# sozinho (DNS-01 Cloudflare); o nginx recarrega pra pegar as renovações.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Copia os arquivos pro servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,Dockerfile,nginx/*,certbot/*"
          target: "/opt/pandora/nginx"

      - name: Sobe certbot + nginx
        uses: appleboy/ssh-action@v1.2.0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: CLOUDFLARE_API_TOKEN,CERTBOT_EMAIL
          script: |
            set -e
            cd /opt/pandora/nginx

            echo "🌐 Garantindo a rede pandora_net..."
            docker network inspect pandora_net >/dev/null 2>&1 || docker network create pandora_net

            echo "🔧 Subindo certbot + nginx..."
            docker compose up -d --build

            echo "🧹 Limpando imagens antigas..."
            docker image prune -f

            echo "✅ Gateway no ar!"
