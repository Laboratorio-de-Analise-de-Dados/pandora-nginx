server {
    listen 80;
    server_name app.project-pandora.com.br;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name app.project-pandora.com.br;

    ssl_certificate     /etc/letsencrypt/live/app.project-pandora.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.project-pandora.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # TLS do cliente termina na Cloudflare — stapling e resolver externo
    # não se aplicam no origin.

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP expandido para permitir Google Fonts, imagens inline e Cloudflare Insights
    add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://api.project-pandora.com.br;" always;



    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss;
    gzip_min_length 256;

    # SPA React - encaminha tudo para o frontend
    location / {
        proxy_pass http://pandora_frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    # Assets estáticos
    location /static/ {
        proxy_pass http://pandora_frontend:80;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}