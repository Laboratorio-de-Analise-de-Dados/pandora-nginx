upstream backend {
    server pandora_web:8000;
}

server {
    listen 80;
    server_name api.project-pandora.com.br;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.project-pandora.com.br;

    ssl_certificate     /etc/letsencrypt/live/api.project-pandora.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.project-pandora.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # TLS do cliente termina na Cloudflare (proxied) — stapling no origin
    # não agrega e o resolver externo não é necessário.
    # O DNS interno do Docker resolve os upstreams (pandora_web).
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    # Cloudflare proxya este host — restaura o IP real do cliente para o
    # Django (logs, throttling). Ranges oficiais: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Upload entra fatiado em chunks de 512KB pelo front (ExperimentContext);
    # o default do nginx é 1m — explícito para o limite não virar armadilha.
    client_max_body_size 2m;

    # O backend processa pesado de forma síncrona na request; gunicorn roda
    # com --timeout 120 (docker-compose.prod.yml). Proxy ≥ app.
    proxy_read_timeout 150s;
    proxy_send_timeout 60s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self';" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss;
    gzip_min_length 256;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host api.project-pandora.com.br;   # ⚠️ Fixar o Host correto
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # static/ e media/ são servidos pelo backend (o nginx não tem acesso aos
    # arquivos do container do Django). Requer WhiteNoise no backend pra /static/.
    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host api.project-pandora.com.br;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location /media/ {
        proxy_pass http://backend;
        proxy_set_header Host api.project-pandora.com.br;
        access_log off;
        # Uploads = dados de paciente: nunca cacheáveis — nem no edge da
        # Cloudflare (cache_level aggressive pegaria .zip/.fcs) nem no
        # browser. add_header em location suprime os headers do server,
        # então os de segurança são repetidos aqui.
        expires off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}