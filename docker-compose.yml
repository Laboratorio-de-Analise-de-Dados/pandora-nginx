services:
  certbot:
    image: certbot/dns-cloudflare
    container_name: pandora_certbot
    restart: always
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
      - CERT_DOMAINS=api.project-pandora.com.br app.project-pandora.com.br
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_logs:/var/log/letsencrypt
      - ./certbot/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      # saudável só quando os dois certificados existirem — trava o start do nginx até lá
      test:
        [
          "CMD-SHELL",
          "test -f /etc/letsencrypt/live/api.project-pandora.com.br/fullchain.pem && test -f /etc/letsencrypt/live/app.project-pandora.com.br/fullchain.pem",
        ]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pandora_nginx
    restart: always
    # recarrega a cada 6h pra pegar certificado renovado, sem derrubar o serviço
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_conf:/etc/letsencrypt:ro
    networks:
      - pandora_net
    depends_on:
      certbot:
        condition: service_healthy

volumes:
  certbot_conf:
  certbot_logs:

networks:
  pandora_net:
    external: true
